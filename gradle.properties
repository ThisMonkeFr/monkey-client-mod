org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Check https://fabricmc.net/develop for the current numbers before building.
# 26.1 onwards is unobfuscated, so there is no mappings dependency any more.
# Loom 1.15 needs Gradle 9.2 or newer; the wrapper is pinned to 9.4.0.
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.159.0+26.2
# Loom 1.15.5 requires Gradle 9.2 or newer. Pinned rather than a snapshot so
# the build does not change under you.
loom_version=1.15.5

mod_version=0.5.0
maven_group=gg.monkeyclient
archives_base_name=monkeyclient
