plugins {
    // 26.1+ is unobfuscated: this is the non-remapping Loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings line: the game ships with real names from 26.1 onward.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    compileOnly files('src/main/resources/META-INF/jars/sodium-fabric-0.9.2+mc26.2.jar')
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version,
               'loader_version': project.loader_version
    }
}

java {
    withSourcesJar()
    /* Minecraft 26.2 ships class file version 69, which is Java 25. Compiling
       against anything older makes javac refuse to read a single Minecraft
       class. The toolchain block lets Gradle fetch a JDK 25 itself, so this
       does not depend on what happens to be installed. */
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

tasks.register('verifyClient', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'Verify'
    args sourceSets.main.output.classesDirs.singleFile.absolutePath
}
tasks.named('check') { dependsOn tasks.named('verifyClient') }
tasks.register('verifyNative', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ExtendedVerify'
    args sourceSets.main.output.classesDirs.singleFile.absolutePath, file('src/main/resources').absolutePath
}
tasks.named('check') { dependsOn tasks.named('verifyNative') }
// Preserve attribution in standard Gradle-built artifacts as well.
tasks.named('jar') { from('FABRISHOT-LICENSE.txt', 'ARMOR-ASSET-LICENSE.txt', 'APPLE-SKIN-LICENSE.txt', 'SHULKER-TOOLTIP-LICENSE.txt', 'BOBBY-LICENSE.md', 'THIRD-PARTY-NOTICES.md') }
